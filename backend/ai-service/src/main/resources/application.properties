# Server
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_ai
spring.datasource.username=postgres
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=ai-chat-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.utkarsh.ai.kafka.event

# AI Kafka topics
ai.kafka.topics.requests=ai.chat.requests
ai.kafka.topics.responses=ai.chat.responses
ai.kafka.topics.dlq=ai.chat.dlq

# AI Kafka consumer toggle
ai.kafka.consumer.enabled=true

# OpenAI Configuration
ai.openai.api-key=${AI_API_KEY:}
ai.openai.model=${AI_MODEL:gpt-4o-mini}
ai.openai.max-tokens=${AI_MAX_TOKENS:1024}
ai.openai.temperature=${AI_TEMPERATURE:0.7}
ai.openai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}