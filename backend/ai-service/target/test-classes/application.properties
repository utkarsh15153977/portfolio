# H2 In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Actuator (disable Redis health check in tests)
management.health.redis.enabled=false

# Kafka (will be overridden by EmbeddedKafka in integration tests)
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}

# Disable Kafka consumer in unit tests (enabled only in integration tests)
ai.kafka.consumer.enabled=false

# OpenAI: no API key in tests -> MockAiProvider activates
ai.openai.api-key=
