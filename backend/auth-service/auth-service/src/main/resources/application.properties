server.port=8089

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_ai
spring.datasource.username=postgres
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# JWT
app.jwt.secret=${JWT_SECRET:VGhpcyBpcyBhIHNlY3VyZSBzaWduaW5nIGtleSBmb3IgUE9SVEZPTElPIEFJIGF1dGggc2VydmljZSBKV1QgdG9rZW4gc2lnbmluZyBrZXk=}
app.jwt.expiration-ms=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Rate Limiting
app.ratelimit.login.max-attempts=5
app.ratelimit.login.window-seconds=900
app.ratelimit.register.max-attempts=5
app.ratelimit.register.window-seconds=3600